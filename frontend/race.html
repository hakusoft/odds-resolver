<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OddsResolver</title>
  <style>

    :root {
      color-scheme: light dark;
      --surface-1: #fbfcfd;
      --surface-2: #eff1f5;
      --text-primary: #0b0c0f;
      --text-secondary: #4f5560;
      --border: #d6dae1;
      --accent: #2d539e;
      --hot: #a02c2c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface-1: #151823;
        --surface-2: #1e2230;
        --text-primary: #ffffff;
        --text-secondary: #b7bfd3;
        --border: #343a4c;
        --accent: #84a0c6;
        --hot: #e27878;
      }
    }
    :root[data-theme="light"] {
      --surface-1: #fbfcfd;
      --surface-2: #eff1f5;
      --text-primary: #0b0c0f;
      --text-secondary: #4f5560;
      --border: #d6dae1;
      --accent: #2d539e;
      --hot: #a02c2c;
    }
    :root[data-theme="dark"] {
      --surface-1: #151823;
      --surface-2: #1e2230;
      --text-primary: #ffffff;
      --text-secondary: #b7bfd3;
      --border: #343a4c;
      --accent: #84a0c6;
      --hot: #e27878;
    }
    :root { --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    body {
      margin: 0;
      background: var(--surface-1);
      color: var(--text-primary);
      font-family: system-ui, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      margin: 0.4rem 0 1.4rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .theme-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-1);
      color: var(--text-primary);
      font: inherit;
      font-size: 0.95rem;
      width: 2rem;
      height: 2rem;
      border-radius: 4px;
      cursor: pointer;
      line-height: 1;
    }
    .theme-btn:hover { border-color: var(--accent); }
    .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      text-decoration: none;
      color: inherit;
    }
    .brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    h1 { font-family: var(--font-mono); font-size: 1.55rem; font-weight: 700; letter-spacing: 0.06em; margin: 0; }

    .brand-mark {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      width: 2rem;
      height: 1.25rem;
      flex: none;
    }
    .brand-mark span { background: var(--accent); border-radius: 2px; }
    .brand-mark span:nth-child(2) { opacity: 0.3; }
    .brand-mark span:nth-child(3) { background: var(--hot); opacity: 0.95; }
    .brand-mark span:nth-child(4) { opacity: 0.18; }
    .brand-mark span:nth-child(5) { opacity: 0.7; }
    .brand-mark span:nth-child(6) { opacity: 0.45; }
    .race-meta { color: var(--text-secondary); font-size: 0.85rem; margin: 0.2rem 0 1.2rem; }
    .chart-title { font-size: 1rem; font-weight: 600; margin: 0 0 0.2rem; }
    .chart-sub { color: var(--text-secondary); font-size: 0.8rem; margin: 0 0 0.8rem; }
    .chart-scroll { overflow-x: auto; }
    svg { display: block; }
    svg text { font-family: system-ui, sans-serif; }

    #tooltip {
      position: fixed;
      pointer-events: none;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.4rem 0.6rem;
      font-size: 0.8rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      opacity: 0;
      transition: opacity 0.08s;
      z-index: 10;
    }
    #tooltip .val { font-weight: 700; font-size: 0.95rem; }
    #tooltip .lbl { color: var(--text-secondary); }

    .legend { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.6rem;
              font-size: 0.75rem; color: var(--text-secondary); }
    .legend-bar { width: 140px; height: 10px; border-radius: 5px; }

    details { margin-top: 1.2rem; }
    summary { cursor: pointer; color: var(--text-secondary); font-size: 0.85rem; }
    table { border-collapse: collapse; font-size: 0.78rem; margin-top: 0.6rem; }
    th, td { border: 1px solid var(--border); padding: 0.25rem 0.5rem; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    thead th { background: var(--surface-2); }

    .site-foot {
      margin-top: 2.5rem;
      padding-top: 0.9rem;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.75rem;
      line-height: 1.7;
    }
    .site-foot p { margin: 0; }
  </style>
  <script>
    (() => {
      const t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <main>
    <header class="masthead">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></span>
        <h1>Odds<span style="font-weight:300;opacity:.8">Resolver</span></h1>
      </a>
      <button class="theme-btn" id="themetoggle" type="button"></button>
    </header>
    <p class="race-meta" id="race-meta">読み込み中…</p>

    <p class="chart-title">支持率ヒートマップ</p>
    <p class="chart-sub">縦=馬、横=時刻。色が濃いほど支持率（1/オッズの正規化）が高い。</p>
    <div class="chart-scroll"><div id="chart"></div></div>
    <div class="legend">
      <span>低</span>
      <div class="legend-bar" id="legend-bar"></div>
      <span>高</span>
      <span style="margin-left:0.8rem">支持率</span>
      <span id="surge-legend" hidden style="margin-left:1.2rem; display:inline-flex; align-items:center; gap:0.35rem">
        <span style="width:12px; height:12px; border:2.5px solid var(--hot); border-radius:3px; display:inline-block"></span>
        締切間際の支持率急上昇
      </span>
    </div>

    <details>
      <summary>データ表で見る（最終スナップショットのオッズ）</summary>
      <div class="chart-scroll"><table id="data-table"></table></div>
    </details>
    <footer class="site-foot">
      <p>オッズは取得時点の参考値で、的中・正確性は保証しません。馬券の購入は20歳から。 © 2026 OddsResolver</p>
    </footer>
  </main>
  <div id="tooltip" role="status"></div>

  <script>

    const themeBtn = document.getElementById("themetoggle");
    function currentTheme() {
      const t = document.documentElement.dataset.theme;
      if (t === "light" || t === "dark") return t;
      return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    function syncThemeBtn() {
      const dark = currentTheme() === "dark";
      themeBtn.textContent = dark ? "\u2600\uFE0E" : "\u263E";
      themeBtn.setAttribute("aria-label", dark ? "ライトモードに切り替え" : "ダークモードに切り替え");
    }
    themeBtn.addEventListener("click", () => {
      const next = currentTheme() === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("theme", next);
      syncThemeBtn();
    });
    syncThemeBtn();

    const RAMP = ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec",
                  "#5598e7", "#3987e5", "#2a78d6", "#256abf", "#1c5cab",
                  "#184f95", "#104281", "#0d366b"];

    const rampColor = t => RAMP[Math.min(RAMP.length - 1, Math.floor(t * RAMP.length))];

    const isDark = t => t > 0.55;

    const CELL_W = 52, CELL_H = 30, GAP = 2;
    const LEFT = 150, TOP = 28;

    async function main() {

      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      if (!id || !/^\d{8}-[a-z]{2}-\d{2}$/.test(id)) {
        throw new Error("レース ID が指定されていない（?id=... が必要）");
      }

      const qnow = params.get("now");
      const now = qnow ? new Date(qnow) : new Date();
      const pad = n => String(n).padStart(2, "0");
      const todayStr = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}`;
      const s3Url = `data/races/${id}.json`;
      const apiUrl = `api/?id=${encodeURIComponent(id)}`;
      const urls = id.slice(0, 8) === todayStr ? [apiUrl, s3Url] : [s3Url, apiUrl];

      let race = null;
      for (const u of urls) {
        try {
          const res = await fetch(u);
          if (!res.ok) continue;
          const ct = res.headers.get("content-type") || "";
          if (!ct.includes("json")) continue;
          race = await res.json();
          break;
        } catch {}
      }
      if (!race) throw new Error("レースデータが見つからない");

      document.getElementById("race-meta").textContent =
        `${race.venue} ${race.race_no}R ${race.name}` +
        (race.surface ? ` ${race.surface}${race.distance}m` : "") +
        ` / 発走 ${race.post_time}`;
      document.title = `OddsResolver — ${race.name}`;

      if (!race.snapshots.length) {
        document.querySelector(".chart-sub").textContent =
          "オッズはまだ取得されていません（発売前・取得待ち）。";
        document.querySelector(".legend").hidden = true;
        document.querySelector("details").hidden = true;
        return;
      }

      const support = race.snapshots.map(s => {
        const inv = s.odds.map(o => (o ? 1 / o : 0));
        const sum = inv.reduce((a, b) => a + b, 0);
        return sum > 0 ? inv.map(v => v / sum) : inv.map(() => 0);
      });
      const maxS = Math.max(...support.flat(), 1e-9);

      // 急変（賢い金）の判定。定義は ingest/surge.py と揃える（#71/#73）:
      // 締切間際 T-20 以降のスロットで、前スナップショットから支持率が
      // +5pt 以上 上昇したセルを拾う。surged[i][j] = true。
      const SURGE_MIN_SLOT = 20, SURGE_DELTA = 0.08;  // ingest/surge.py と揃える（#23）
      const slotMin = s => {
        const m = /^T-(\d+)$/.exec(s.slot || "");
        return m ? Number(m[1]) : (s.slot === "F" ? 0 : null);
      };
      const surged = support.map(() => race.horses.map(() => false));
      for (let i = 1; i < race.snapshots.length; i++) {
        const mn = slotMin(race.snapshots[i]);
        if (mn == null || mn > SURGE_MIN_SLOT) continue;
        for (let j = 0; j < race.horses.length; j++) {
          if (support[i][j] - support[i - 1][j] >= SURGE_DELTA) surged[i][j] = true;
        }
      }

      const posByNum = new Map((race.result || []).map(r => [r.num, r.pos]));
      const nH = race.horses.length, nT = race.snapshots.length;
      const w = LEFT + nT * (CELL_W + GAP) + (posByNum.size ? 44 : 0);
      const h = TOP + nH * (CELL_H + GAP);

      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("width", w);
      svg.setAttribute("height", h);
      svg.setAttribute("role", "img");
      svg.setAttribute("aria-label", "馬ごとの支持率の時間推移ヒートマップ");

      race.snapshots.forEach((s, i) => {
        const tx = document.createElementNS(svgNS, "text");
        tx.setAttribute("x", LEFT + i * (CELL_W + GAP) + CELL_W / 2);
        tx.setAttribute("y", TOP - 10);
        tx.setAttribute("text-anchor", "middle");
        tx.setAttribute("font-size", "11");
        tx.setAttribute("fill", "var(--text-secondary)");
        tx.textContent = s.time;
        svg.appendChild(tx);
      });

      const tooltip = document.getElementById("tooltip");
      race.horses.forEach((horse, j) => {
        const ty = TOP + j * (CELL_H + GAP) + CELL_H / 2;
        const tx = document.createElementNS(svgNS, "text");
        tx.setAttribute("x", LEFT - 8);
        tx.setAttribute("y", ty + 4);
        tx.setAttribute("text-anchor", "end");
        tx.setAttribute("font-size", "12");
        tx.setAttribute("fill", "var(--text-primary)");
        tx.textContent = `${horse.num} ${horse.name}`;
        svg.appendChild(tx);

        const pos = posByNum.get(horse.num);
        if (pos && pos <= 3) {
          const badge = document.createElementNS(svgNS, "text");
          badge.setAttribute("x", LEFT + nT * (CELL_W + GAP) + 8);
          badge.setAttribute("y", ty + 4);
          badge.setAttribute("font-size", "12");
          badge.setAttribute("fill", pos === 1 ? "var(--hot)" : "var(--text-secondary)");
          if (pos === 1) badge.setAttribute("font-weight", "700");
          badge.textContent = `${pos}着`;
          svg.appendChild(badge);
        }

        race.snapshots.forEach((s, i) => {
          const t = support[i][j] / maxS;
          const isSurge = surged[i][j];
          const cx = LEFT + i * (CELL_W + GAP), cy = TOP + j * (CELL_H + GAP);
          const rect = document.createElementNS(svgNS, "rect");
          rect.setAttribute("x", cx);
          rect.setAttribute("y", cy);
          rect.setAttribute("width", CELL_W);
          rect.setAttribute("height", CELL_H);
          rect.setAttribute("rx", 3);
          rect.setAttribute("fill", rampColor(t));
          rect.setAttribute("tabindex", "0");
          if (isSurge) {
            // 急変（賢い金）を hot 色の枠で強調。青いヒートマップと分離
            rect.setAttribute("stroke", "var(--hot)");
            rect.setAttribute("stroke-width", "2.5");
          }

          const show = ev => {
            rect.setAttribute("stroke", isSurge ? "var(--hot)"
                              : (isDark(t) ? "#ffffff" : "#0b0b0b"));
            rect.setAttribute("stroke-width", isSurge ? "2.5" : "1.5");
            tooltip.replaceChildren();
            const v = document.createElement("div");
            v.className = "val";
            v.textContent = s.odds[j] ? `${s.odds[j].toFixed(1)} 倍` : "オッズなし";
            const l = document.createElement("div");
            l.className = "lbl";
            const up = isSurge
              ? ` / 急上昇 +${((support[i][j] - support[i - 1][j]) * 100).toFixed(1)}pt`
              : "";
            l.textContent = `${horse.num} ${horse.name} / ${s.time} / 支持率 ${(support[i][j] * 100).toFixed(1)}%${up}`;
            tooltip.append(v, l);
            tooltip.style.opacity = "1";
            const px = ev.clientX ?? rect.getBoundingClientRect().x;
            const py = ev.clientY ?? rect.getBoundingClientRect().y;
            tooltip.style.left = Math.min(px + 14, innerWidth - 240) + "px";
            tooltip.style.top = (py + 14) + "px";
          };
          const hide = () => {
            if (isSurge) {
              rect.setAttribute("stroke", "var(--hot)");
              rect.setAttribute("stroke-width", "2.5");
            } else {
              rect.removeAttribute("stroke");
            }
            tooltip.style.opacity = "0";
          };
          rect.addEventListener("pointermove", show);
          rect.addEventListener("pointerleave", hide);
          rect.addEventListener("focus", show);
          rect.addEventListener("blur", hide);
          svg.appendChild(rect);
        });
      });

      document.getElementById("chart").appendChild(svg);

      document.getElementById("legend-bar").style.background =
        `linear-gradient(to right, ${RAMP[0]}, ${RAMP[6]}, ${RAMP[12]})`;

      if (surged.some(row => row.some(Boolean)))
        document.getElementById("surge-legend").hidden = false;

      const last = race.snapshots[nT - 1];
      const lastSupport = support[nT - 1];
      const table = document.getElementById("data-table");
      const thead = document.createElement("thead");
      const hr = document.createElement("tr");
      const cols = posByNum.size
        ? ["馬", "着順", `オッズ (${last.time})`, "支持率"]
        : ["馬", `オッズ (${last.time})`, "支持率"];
      cols.forEach(x => {
        const th = document.createElement("th");
        th.textContent = x;
        hr.appendChild(th);
      });
      thead.appendChild(hr);
      const tbody = document.createElement("tbody");
      race.horses.forEach((horse, j) => {
        const tr = document.createElement("tr");
        const cells = [`${horse.num} ${horse.name}`];
        if (posByNum.size) {
          const p = posByNum.get(horse.num);
          cells.push(p ? `${p}` : "—");
        }
        cells.push(last.odds[j] ? `${last.odds[j].toFixed(1)}` : "—",
                   `${(lastSupport[j] * 100).toFixed(1)}%`);
        cells.forEach(x => {
          const td = document.createElement("td");
          td.textContent = x;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.append(thead, tbody);
    }

    main().catch(e => {
      document.getElementById("race-meta").textContent = "データの読み込みに失敗: " + e.message;
    });
  </script>
</body>
</html>
