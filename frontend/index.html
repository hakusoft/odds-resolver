<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OddsResolver</title>
  <style>

    :root {
      color-scheme: light dark;
      --surface-1: #fbfcfd;
      --surface-2: #eff1f5;
      --text-primary: #0b0c0f;
      --text-secondary: #4f5560;
      --border: #d6dae1;
      --accent: #1e50a2;
      --on-accent: #ffffff;
      --hot: #b8432c;
      --cool: #0e8f7e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface-1: #151823;
        --surface-2: #1e2230;
        --text-primary: #ffffff;
        --text-secondary: #b7bfd3;
        --border: #343a4c;
        --accent: #6487e6;
        --on-accent: #10131a;
        --hot: #e0674c;
        --cool: #1e9d89;
      }
    }
    :root[data-theme="light"] {
      --surface-1: #fbfcfd;
      --surface-2: #eff1f5;
      --text-primary: #0b0c0f;
      --text-secondary: #4f5560;
      --border: #d6dae1;
      --accent: #1e50a2;
      --on-accent: #ffffff;
      --hot: #b8432c;
      --cool: #0e8f7e;
    }
    :root[data-theme="dark"] {
      --surface-1: #151823;
      --surface-2: #1e2230;
      --text-primary: #ffffff;
      --text-secondary: #b7bfd3;
      --border: #343a4c;
      --accent: #6487e6;
      --on-accent: #10131a;
      --hot: #e0674c;
      --cool: #1e9d89;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--surface-1);
      color: var(--text-primary);
      font-family: system-ui, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 760px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem 1.2rem;
      flex-wrap: wrap;
      margin: 0 0 1.2rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: inherit;
    }
    .brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    h1 { font-size: 1.5rem; letter-spacing: 0.04em; margin: 0; }

    .brand-mark {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      width: 2rem;
      height: 1.25rem;
      flex: none;
    }
    .brand-mark span { background: var(--accent); border-radius: 2px; }
    .brand-mark span:nth-child(2) { opacity: 0.3; }
    .brand-mark span:nth-child(3) { background: var(--hot); opacity: 0.95; }
    .brand-mark span:nth-child(4) { opacity: 0.18; }
    .brand-mark span:nth-child(5) { opacity: 0.7; }
    .brand-mark span:nth-child(6) { opacity: 0.45; }

    .datebar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0 0 1rem;
    }
    .datenav {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-1);
      color: var(--text-primary);
      font: inherit;
      width: 2rem;
      height: 2rem;
      border-radius: 4px;
      cursor: pointer;
      line-height: 1;
    }
    .datenav:hover:not(:disabled) { border-color: var(--accent); }
    .datenav:disabled { opacity: 0.35; cursor: default; }
    .datenav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .dateselect {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-1);
      color: var(--text-primary);
      font: inherit;
      font-size: 0.95rem;
      padding: 0.35rem 2rem 0.35rem 0.7rem;
      border-radius: 4px;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
      background-image: linear-gradient(45deg, transparent 50%, var(--text-secondary) 50%),
                        linear-gradient(135deg, var(--text-secondary) 50%, transparent 50%);
      background-position: calc(100% - 1.1rem) center, calc(100% - 0.75rem) center;
      background-size: 0.35rem 0.35rem, 0.35rem 0.35rem;
      background-repeat: no-repeat;
    }
    .dateselect:hover { border-color: var(--accent); }
    .dateselect:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin: 0 0 1.1rem;
    }
    @media (max-width: 560px) { .hero { grid-template-columns: 1fr; } }
    .hero-card {
      display: block;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.7rem 0.9rem 0.8rem;
      text-decoration: none;
      color: var(--text-primary);
      background: var(--surface-1);
    }
    .hero-card:hover, .hero-card:focus-visible {
      background: var(--surface-2);
      outline: none;
    }
    .hero-card.hot { border-color: color-mix(in srgb, var(--hot) 45%, var(--border)); }
    .hero-card.cool { border-color: color-mix(in srgb, var(--cool) 45%, var(--border)); }
    .hero-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .hot .hero-label { color: var(--hot); }
    .cool .hero-label { color: var(--cool); }
    .hero-title {
      margin: 0.15rem 0 0.1rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hero-stat {
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
    }
    .hero-bar {
      display: flex;
      gap: 2px;
      height: 8px;
      margin-top: 0.55rem;
      border-radius: 4px;
      overflow: hidden;
    }
    .hero-bar span { min-width: 2px; }
    .hot .hero-bar span { background: var(--hot); }
    .cool .hero-bar span { background: var(--cool); }

    .chip {
      flex: none;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 0.05rem 0.45rem;
      border-radius: 999px;
      border: 1px solid;
    }
    .chip.hot { color: var(--hot); border-color: color-mix(in srgb, var(--hot) 55%, transparent); }
    .chip.cool { color: var(--cool); border-color: color-mix(in srgb, var(--cool) 55%, transparent); }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      margin: 0 0 1rem;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      appearance: none;
      border: none;
      background: none;
      color: var(--text-secondary);
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.25rem 0.1rem 0.5rem;
      margin-bottom: -1px;
      border-bottom: 2px solid transparent;
      cursor: pointer;
    }
    .tab:hover { color: var(--text-primary); }
    .tab[aria-selected="true"] {
      color: var(--text-primary);
      border-bottom-color: var(--accent);
    }
    .tab .count {
      font-variant-numeric: tabular-nums;
      font-size: 0.78rem;
      opacity: 0.7;
      margin-left: 0.35em;
    }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .races { display: flex; flex-direction: column; }
    .race-link {
      display: grid;

      grid-template-columns: 2.6em minmax(0, 1fr) auto auto auto;
      align-items: center;
      gap: 0.7rem;
      padding: 0.6rem 0.6rem;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text-primary);
    }
    .race-link:first-child { border-top: 1px solid var(--border); }
    .race-link:hover, .race-link:focus-visible {
      background: var(--surface-2);
      outline: none;
    }
    .race-no {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      text-align: right;
    }
    .race-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .race-time, .race-heads {
      color: var(--text-secondary);
      font-size: 0.8rem;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .race-time { min-width: 2.9em; }
    .race-heads { min-width: 2.6em; }
    .empty { color: var(--text-secondary); padding: 1rem 0; }

    .site-foot {
      margin-top: 2.5rem;
      padding-top: 0.9rem;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.75rem;
      line-height: 1.7;
    }
    .site-foot p { margin: 0; }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></span>
        <h1>Odds<span style="opacity:.55">Resolver</span></h1>
      </a>
    </header>
    <p class="empty" id="status">読み込み中…</p>
    <div class="hero" id="hero" hidden></div>
    <div class="datebar" id="datebar" hidden>
      <button class="datenav" id="prevDay" type="button" aria-label="前の開催日">‹</button>
      <select class="dateselect" id="dateselect" aria-label="開催日"></select>
      <button class="datenav" id="nextDay" type="button" aria-label="次の開催日">›</button>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="開催会場"></div>
    <div class="races" id="races" role="tabpanel"></div>
    <footer class="site-foot">
      <p>オッズは取得時点の参考値です。的中・正確性を保証するものではありません。</p>
      <p>馬券の購入は20歳になってから。 © 2026 OddsResolver</p>
    </footer>
  </main>

  <script>

    function shortName(name) {
      if (!name) return "";
      const parts = name.split(/[　\s]+/).filter(Boolean);
      let label = parts[0] || name;

      if (label.length <= 2 && parts[1] && parts[1] !== parts[0]) {
        label = parts[0] + " " + parts[1];
      }
      return label;
    }

    let days = [];
    let currentDate = null;   // "2026-07-24"
    let byVenue = new Map();
    let venues = [];

    function setHash(date, venue) {
      const h = "#" + encodeURIComponent(date) + (venue ? "/" + encodeURIComponent(venue) : "");
      if (location.hash !== h) history.replaceState(null, "", h);
    }

    function parseHash() {
      const raw = location.hash.slice(1);
      if (!raw) return { date: null, venue: null };
      const [d, v] = raw.split("/");
      return { date: d ? decodeURIComponent(d) : null, venue: v ? decodeURIComponent(v) : null };
    }

    function selectVenue(venue) {
      for (const btn of document.querySelectorAll(".tab")) {
        btn.setAttribute("aria-selected", String(btn.dataset.venue === venue));
      }
      setHash(currentDate, venue);

      const races = byVenue.get(venue) || [];
      const panel = document.getElementById("races");
      panel.innerHTML = "";
      if (races.length === 0) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "この会場のレースはありません。";
        panel.appendChild(p);
        return;
      }
      for (const r of races) {
        const a = document.createElement("a");
        a.className = "race-link";
        a.href = `race.html?id=${encodeURIComponent(r.race_id)}`;

        const no = document.createElement("span");
        no.className = "race-no";
        no.textContent = `${r.race_no}R`;

        const name = document.createElement("span");
        name.className = "race-name";
        name.textContent = shortName(r.name);
        name.title = r.name;

        const chipCell = document.createElement("span");
        const kind = raceKind(r);
        if (kind) {
          chipCell.className = `chip ${kind}`;
          chipCell.textContent = kind === "hot" ? "一強" : "混戦";
        }

        const time = document.createElement("span");
        time.className = "race-time";
        time.textContent = r.post_time;

        const heads = document.createElement("span");
        heads.className = "race-heads";
        heads.textContent = `${r.n_horses}頭`;

        a.append(no, name, chipCell, time, heads);
        panel.appendChild(a);
      }
    }

    const TOP1_MIN = 0.60;
    const ENT_MIN = 0.84;
    function raceKind(r) {
      if (r.top1 == null) return null;
      if (r.top1 >= TOP1_MIN) return "hot";
      if (r.ent >= ENT_MIN) return "cool";
      return null;
    }

    async function renderHero(idx) {
      const hero = document.getElementById("hero");
      hero.innerHTML = "";
      const scored = idx.races.filter(r => r.top1 != null);
      if (scored.length === 0) { hero.hidden = true; return; }
      const hot = scored.reduce((a, b) => (b.top1 > a.top1 ? b : a));
      const cool = scored.reduce((a, b) => (b.ent > a.ent ? b : a));

      const defs = [
        { r: hot, cls: "hot", label: "本命一強" },
        { r: cool, cls: "cool", label: "大混戦" },
      ];
      for (const { r, cls, label } of defs) {
        const a = document.createElement("a");
        a.className = `hero-card ${cls}`;
        a.href = `race.html?id=${encodeURIComponent(r.race_id)}`;

        const lb = document.createElement("div");
        lb.className = "hero-label";
        lb.textContent = label;

        const tt = document.createElement("div");
        tt.className = "hero-title";
        tt.textContent = `${r.venue} ${r.race_no}R ・ ${shortName(r.name)}`;
        tt.title = r.name;

        const st = document.createElement("div");
        st.className = "hero-stat";
        st.textContent =
          `1番人気 支持率${Math.round(r.top1 * 100)}% ・ 発走 ${r.post_time} ・ ${r.n_horses}頭`;

        const bar = document.createElement("div");
        bar.className = "hero-bar";

        a.append(lb, tt, st, bar);
        hero.appendChild(a);

        fillHeroBar(bar, r.race_id);
      }
      hero.hidden = false;
    }

    async function fillHeroBar(bar, raceId) {
      try {
        const res = await fetch(`data/races/${encodeURIComponent(raceId)}.json`);
        if (!res.ok) return;
        const race = await res.json();
        const odds = race.snapshots[race.snapshots.length - 1].odds;
        const inv = odds.map(o => (o ? 1 / o : 0));
        const s = inv.reduce((a, b) => a + b, 0);
        if (s <= 0) return;
        const sup = inv.map(x => x / s).sort((a, b) => b - a);
        for (const p of sup) {
          const seg = document.createElement("span");
          seg.style.flexGrow = String(p);
          seg.style.opacity = String(0.35 + 0.65 * (p / sup[0]));
          bar.appendChild(seg);
        }
      } catch {  }
    }

    async function selectDate(date, wantVenue) {
      const dir = date.replaceAll("-", ""); // "2026-07-24" -> "20260724"
      const res = await fetch(`data/${dir}/index.json`);
      if (!res.ok) throw new Error(`${date} の目次取得に失敗 (${res.status})`);
      const idx = await res.json();
      currentDate = date;

      document.getElementById("dateselect").value = date;
      const i = days.findIndex(d => d.date === date);
      document.getElementById("prevDay").disabled = i >= days.length - 1;
      document.getElementById("nextDay").disabled = i <= 0;

      byVenue = new Map();
      for (const r of idx.races) {
        if (!byVenue.has(r.venue)) byVenue.set(r.venue, []);
        byVenue.get(r.venue).push(r);
      }
      for (const races of byVenue.values()) races.sort((a, b) => a.race_no - b.race_no);
      venues = [...byVenue.keys()];

      const tabs = document.getElementById("tabs");
      tabs.innerHTML = "";
      for (const venue of venues) {
        const btn = document.createElement("button");
        btn.className = "tab";
        btn.type = "button";
        btn.setAttribute("role", "tab");
        btn.dataset.venue = venue;
        btn.setAttribute("aria-selected", "false");
        const label = document.createElement("span");
        label.textContent = venue;
        const cnt = document.createElement("span");
        cnt.className = "count";
        cnt.textContent = `${byVenue.get(venue).length}R`;
        btn.append(label, cnt);
        btn.addEventListener("click", () => selectVenue(venue));
        tabs.appendChild(btn);
      }

      const venue = venues.includes(wantVenue) ? wantVenue : venues[0];
      if (venue) selectVenue(venue);
    }

    function stepDay(delta) {
      const i = days.findIndex(d => d.date === currentDate);
      const j = i + delta;
      if (j < 0 || j >= days.length) return;
      selectDate(days[j].date, null).catch(showError);
    }

    function showError(e) {
      document.getElementById("status").hidden = false;
      document.getElementById("status").textContent = "読み込みに失敗: " + e.message;
    }

    async function main() {
      const res = await fetch("data/days.json");
      if (!res.ok) throw new Error(`日付目次の取得に失敗 (${res.status})`);
      days = (await res.json()).days || [];
      if (days.length === 0) throw new Error("開催日がありません");

      const sel = document.getElementById("dateselect");
      for (const d of days) {
        const opt = document.createElement("option");
        opt.value = d.date;
        opt.textContent = `${d.date}（${d.n_venues}会場・${d.n_races}R）`;
        sel.appendChild(opt);
      }
      sel.addEventListener("change", () => selectDate(sel.value, null).catch(showError));
      document.getElementById("prevDay").addEventListener("click", () => stepDay(+1));
      document.getElementById("nextDay").addEventListener("click", () => stepDay(-1));

      const { date, venue } = parseHash();
      const initialDate = days.some(d => d.date === date) ? date : days[0].date;

      const latestDir = days[0].date.replaceAll("-", "");
      fetch(`data/${latestDir}/index.json`)
        .then(r => (r.ok ? r.json() : null))
        .then(idx => { if (idx) renderHero(idx); })
        .catch(() => {});

      document.getElementById("status").hidden = true;
      document.getElementById("datebar").hidden = false;
      await selectDate(initialDate, venue);
    }

    main().catch(showError);
  </script>
</body>
</html>
