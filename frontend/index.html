<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OddsResolver</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface-1: #fcfcfb;
      --surface-2: #f0efec;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --border: #d8d7d2;
      --accent: #2a78d6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface-1: #1a1a19;
        --surface-2: #262625;
        --text-primary: #ffffff;
        --text-secondary: #c3c2b7;
        --border: #3d3d3a;
        --accent: #3987e5;
      }
    }
    :root[data-theme="light"] {
      --surface-1: #fcfcfb;
      --surface-2: #f0efec;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --border: #d8d7d2;
      --accent: #2a78d6;
    }
    :root[data-theme="dark"] {
      --surface-1: #1a1a19;
      --surface-2: #262625;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --border: #3d3d3a;
      --accent: #3987e5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--surface-1);
      color: var(--text-primary);
      font-family: system-ui, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 760px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    h1 { font-size: 1.4rem; letter-spacing: 0.04em; margin: 0; }
    .tagline { color: var(--text-secondary); font-size: 0.85rem; margin: 0.2rem 0 1.25rem; }

    /* 日付切り替え */
    .datebar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0 0 1rem;
    }
    .datenav {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-1);
      color: var(--text-primary);
      font: inherit;
      width: 2rem;
      height: 2rem;
      border-radius: 8px;
      cursor: pointer;
      line-height: 1;
    }
    .datenav:hover:not(:disabled) { border-color: var(--accent); }
    .datenav:disabled { opacity: 0.35; cursor: default; }
    .datenav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .dateselect {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-1);
      color: var(--text-primary);
      font: inherit;
      font-size: 0.95rem;
      padding: 0.35rem 2rem 0.35rem 0.7rem;
      border-radius: 8px;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
      background-image: linear-gradient(45deg, transparent 50%, var(--text-secondary) 50%),
                        linear-gradient(135deg, var(--text-secondary) 50%, transparent 50%);
      background-position: calc(100% - 1.1rem) center, calc(100% - 0.75rem) center;
      background-size: 0.35rem 0.35rem, 0.35rem 0.35rem;
      background-repeat: no-repeat;
    }
    .dateselect:hover { border-color: var(--accent); }
    .dateselect:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .datemeta { color: var(--text-secondary); font-size: 0.8rem; white-space: nowrap; }

    /* 会場タブ */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin: 0 0 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.6rem;
    }
    .tab {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-1);
      color: var(--text-secondary);
      font: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.02em;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
    }
    .tab:hover { border-color: var(--accent); color: var(--text-primary); }
    .tab[aria-selected="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .tab .count {
      font-variant-numeric: tabular-nums;
      font-size: 0.78rem;
      opacity: 0.7;
      margin-left: 0.35em;
    }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* レース行 */
    .races { display: flex; flex-direction: column; }
    .race-link {
      display: grid;
      grid-template-columns: 2.6em 1fr auto;
      align-items: center;
      gap: 0.7rem;
      padding: 0.6rem 0.6rem;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text-primary);
    }
    .race-link:first-child { border-top: 1px solid var(--border); }
    .race-link:hover, .race-link:focus-visible {
      background: var(--surface-2);
      outline: none;
    }
    .race-no {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      text-align: right;
    }
    .race-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .race-sub {
      color: var(--text-secondary);
      font-size: 0.8rem;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .empty { color: var(--text-secondary); padding: 1rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>Odds<span style="opacity:.55">Resolver</span></h1>
    <p class="tagline">数字の羅列を、動きと歪みの地図へ。</p>
    <div class="datebar" id="datebar" hidden>
      <button class="datenav" id="prevDay" type="button" aria-label="前の開催日">‹</button>
      <select class="dateselect" id="dateselect" aria-label="開催日"></select>
      <button class="datenav" id="nextDay" type="button" aria-label="次の開催日">›</button>
      <span class="datemeta" id="datemeta"></span>
    </div>
    <p class="empty" id="status">読み込み中…</p>
    <div class="tabs" id="tabs" role="tablist" aria-label="開催会場"></div>
    <div class="races" id="races" role="tabpanel"></div>
  </main>

  <script>
    // 生表記のレース名から、表示用に先頭の条件部分だけを取り出す。
    // 例: "Ｃ３三　Ｃ３三　３歳以上" → "Ｃ３三"。データ側は生表記のまま保持する。
    function shortName(name) {
      if (!name) return "";
      const parts = name.split(/[　\s]+/).filter(Boolean);
      let label = parts[0] || name;
      // 先頭語が短すぎる（記号1個など）ときは2語目まで拾って情報量を確保。
      if (label.length <= 2 && parts[1] && parts[1] !== parts[0]) {
        label = parts[0] + " " + parts[1];
      }
      return label;
    }

    // 状態: いま選んでいる開催日と会場。URL ハッシュ #日付/会場 に写す。
    let days = [];            // days.json の配列（新しい順）
    let currentDate = null;   // "2026-07-24"
    let byVenue = new Map();
    let venues = [];

    function setHash(date, venue) {
      const h = "#" + encodeURIComponent(date) + (venue ? "/" + encodeURIComponent(venue) : "");
      if (location.hash !== h) history.replaceState(null, "", h);
    }

    function parseHash() {
      const raw = location.hash.slice(1);
      if (!raw) return { date: null, venue: null };
      const [d, v] = raw.split("/");
      return { date: d ? decodeURIComponent(d) : null, venue: v ? decodeURIComponent(v) : null };
    }

    function selectVenue(venue) {
      for (const btn of document.querySelectorAll(".tab")) {
        btn.setAttribute("aria-selected", String(btn.dataset.venue === venue));
      }
      setHash(currentDate, venue);

      const races = byVenue.get(venue) || [];
      const panel = document.getElementById("races");
      panel.innerHTML = "";
      if (races.length === 0) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "この会場のレースはありません。";
        panel.appendChild(p);
        return;
      }
      for (const r of races) {
        const a = document.createElement("a");
        a.className = "race-link";
        a.href = `race.html?id=${encodeURIComponent(r.race_id)}`;

        const no = document.createElement("span");
        no.className = "race-no";
        no.textContent = `${r.race_no}R`;

        const name = document.createElement("span");
        name.className = "race-name";
        name.textContent = shortName(r.name);
        name.title = r.name; // 生表記全文はツールチップで確認できる

        const sub = document.createElement("span");
        sub.className = "race-sub";
        sub.textContent = `${r.post_time} ・ ${r.n_horses}頭`;

        a.append(no, name, sub);
        panel.appendChild(a);
      }
    }

    // 開催日を切り替える。日別 index を読み、会場タブとレース一覧を作り直す。
    async function selectDate(date, wantVenue) {
      const dir = date.replaceAll("-", ""); // "2026-07-24" -> "20260724"
      const res = await fetch(`data/${dir}/index.json`);
      if (!res.ok) throw new Error(`${date} の目次取得に失敗 (${res.status})`);
      const idx = await res.json();
      currentDate = date;

      // 日付セレクタ・前後ナビの状態を同期
      document.getElementById("dateselect").value = date;
      const i = days.findIndex(d => d.date === date);
      document.getElementById("prevDay").disabled = i >= days.length - 1; // 過去方向
      document.getElementById("nextDay").disabled = i <= 0;               // 未来方向
      const meta = days[i];
      document.getElementById("datemeta").textContent =
        meta ? `${meta.n_venues}会場 ・ ${meta.n_races}レース` : "";

      // フラットな races を会場でグループ化し、R 番号順に並べる。
      byVenue = new Map();
      for (const r of idx.races) {
        if (!byVenue.has(r.venue)) byVenue.set(r.venue, []);
        byVenue.get(r.venue).push(r);
      }
      for (const races of byVenue.values()) races.sort((a, b) => a.race_no - b.race_no);
      venues = [...byVenue.keys()];

      // 会場タブを作り直す
      const tabs = document.getElementById("tabs");
      tabs.innerHTML = "";
      for (const venue of venues) {
        const btn = document.createElement("button");
        btn.className = "tab";
        btn.type = "button";
        btn.setAttribute("role", "tab");
        btn.dataset.venue = venue;
        btn.setAttribute("aria-selected", "false");
        const label = document.createElement("span");
        label.textContent = venue;
        const cnt = document.createElement("span");
        cnt.className = "count";
        cnt.textContent = `${byVenue.get(venue).length}R`;
        btn.append(label, cnt);
        btn.addEventListener("click", () => selectVenue(venue));
        tabs.appendChild(btn);
      }

      const venue = venues.includes(wantVenue) ? wantVenue : venues[0];
      if (venue) selectVenue(venue);
    }

    function stepDay(delta) {
      const i = days.findIndex(d => d.date === currentDate);
      const j = i + delta;
      if (j < 0 || j >= days.length) return;
      selectDate(days[j].date, null).catch(showError);
    }

    function showError(e) {
      document.getElementById("status").hidden = false;
      document.getElementById("status").textContent = "読み込みに失敗: " + e.message;
    }

    async function main() {
      const res = await fetch("data/days.json");
      if (!res.ok) throw new Error(`日付目次の取得に失敗 (${res.status})`);
      days = (await res.json()).days || [];
      if (days.length === 0) throw new Error("開催日がありません");

      // 日付セレクタを埋める（新しい順）
      const sel = document.getElementById("dateselect");
      for (const d of days) {
        const opt = document.createElement("option");
        opt.value = d.date;
        opt.textContent = `${d.date}（${d.n_venues}会場・${d.n_races}R）`;
        sel.appendChild(opt);
      }
      sel.addEventListener("change", () => selectDate(sel.value, null).catch(showError));
      document.getElementById("prevDay").addEventListener("click", () => stepDay(+1)); // 過去へ
      document.getElementById("nextDay").addEventListener("click", () => stepDay(-1)); // 未来へ

      // 初期状態: URL ハッシュ #日付/会場 があればそれ、無ければ最新日
      const { date, venue } = parseHash();
      const initialDate = days.some(d => d.date === date) ? date : days[0].date;

      document.getElementById("status").hidden = true;
      document.getElementById("datebar").hidden = false;
      await selectDate(initialDate, venue);
    }

    main().catch(showError);
  </script>
</body>
</html>
